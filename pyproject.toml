[project]
name = "finger_exoskeleton"
version = "0.1.0"
description = "Adaptive hand exoskeleton for Parkinsonian tremor suppression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "flake8",
    "pylint",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["main_sensor.py", "source", "tests"]
strict = true
warn_unused_configs = true

[tool.pylint.main]
py-version = "3.10"
ignore-paths = ["^\\.venv/.*$"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
]
